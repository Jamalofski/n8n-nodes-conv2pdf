# Publishes the package to npm on every version tag push, with an npm provenance
# statement: n8n requires it for verified community nodes since May 1, 2026.
#
# Authentication is npm Trusted Publishing (OIDC): the package on npmjs.com trusts
# this repository and this workflow file, so no npm token is stored anywhere.
#
# To release, run `npm run release` locally. It lints, builds, bumps the version,
# updates the changelog, commits, tags and pushes; the tag push triggers this workflow.

name: Publish

on:
  push:
    tags:
      # Matches 1.0.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'
  # Run by hand: checks the trusted publisher without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # npm reports a refused OIDC exchange as ENEEDAUTH ("need auth"), without its reason
  # (npm/cli#9088). This job makes the exchange alone, from this same workflow file as
  # the trusted publisher requires, and prints npm's answer and the claims it judged.
  # The npm token of a successful exchange is never printed and expires on its own.
  check-trusted-publisher:
    name: Check the trusted publisher
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Exchange a GitHub OIDC token with npm
        run: |
          set -euo pipefail
          package='n8n-nodes-conv2pdf'
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          echo 'Claims of the GitHub token:'
          ID_TOKEN="$id_token" node -e 'console.log(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString())' \
            | jq '{repository, repository_owner, repository_owner_id, workflow_ref, job_workflow_ref, ref, environment}'
          status=$(curl -sS -o answer.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$package")
          echo "npm answered HTTP $status:"
          jq 'del(.token)' answer.json 2>/dev/null || head -c 500 answer.json
          rm -f answer.json

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token used by Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # No install scripts run in the job that can publish.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      # Lints, builds, then runs `npm publish` with a provenance statement.
      - name: Release
        run: npm run release
